<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Chat</title>
    <!-- PeerJS library for connecting two devices directly -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .id-box { background: #e3f2fd; padding: 10px; border-radius: 5px; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        input { width: 80%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; margin-top: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #chat-box { height: 250px; border: 1px solid #ddd; margin-top: 20px; border-radius: 5px; overflow-y: auto; padding: 10px; text-align: left; background: #fafafa; }
        .msg { margin-bottom: 8px; padding: 8px; border-radius: 5px; }
        .my-msg { background: #d1e7dd; text-align: right; }
        .friend-msg { background: #f8d7da; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔒 Secret Chat</h2>
    
    <div class="id-box">
        Aapki Unique ID: <span id="my-id" style="color: red;">Generating...</span>
    </div>

    <div>
        <input type="text" id="friend-id" placeholder="Dost ki 4-digit ID dalein">
        <button onclick="connectToFriend()">Connect</button>
    </div>

    <div id="chat-box"></div>

    <div style="display: flex; gap: 5px; margin-top: 10px;">
        <input type="text" id="msg-input" placeholder="Message type karein..." style="flex: 1;">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // 4-digit ka random unique ID generate karna
    const randomID = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(randomID);
    let conn;

    // Jab app khule aur ID ban jaye
    peer.on('open', function(id) {
        document.getElementById('my-id').innerText = id;
    });

    // Jab dusra mobile aapse connect kare
    peer.on('connection', function(connection) {
        conn = connection;
        setupChat();
    });

    // Dusre mobile se connect karne ka function
    function connectToFriend() {
        const friendId = document.getElementById('friend-id').value;
        if (!friendId) return alert("Pehle ID enter karein!");
        conn = peer.connect(friendId);
        setupChat();
    }

    // Chat setup aur message receive karne ka function
    function setupChat() {
        conn.on('open', function() {
            addMessage("System", "Connected! Ab aap chat kar sakte hain.", "friend-msg");
        });
        
        conn.on('data', function(data) {
            addMessage("Friend", data, "friend-msg");
        });
    }

    // Message send karne ka function
    function sendMessage() {
        const msg = document.getElementById('msg-input').value;
        if (!msg || !conn) return;
        
        conn.send(msg);
        addMessage("Me", msg, "my-msg");
        document.getElementById('msg-input').value = "";
    }

    // Screen par message dikhane ka function
    function addMessage(sender, msg, className) {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div class="msg ${className}"><b>${sender}:</b> ${msg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll
    }
</script>

</body>
</html>
